name: CI

on:
  push:
    branches: [main]
    # Without this, a tag push matches no trigger at all and the
    # release-binaries job below — gated on `refs/tags/` — can never run.
    tags: ['v*']
  pull_request:

jobs:
  test-macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install fixture tooling
        run: brew install ffmpeg

      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/output
          key: ffmpeg-${{ hashFiles('build/versions.json', 'build/scripts/**', 'build/patches/**') }}-macos-arm64

      - name: Download FFmpeg and dav1d sources
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: build/scripts/fetch-sources.sh

      - name: Install build tooling
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install meson ninja

      - name: Build FFmpeg (macOS slice)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: build/scripts/build-ffmpeg.sh macos-arm64

      - name: Package xcframework
        run: build/scripts/make-xcframework.sh

      # Up front rather than lazily from the first test that needs one: the
      # lazy path waits for the ffmpeg child process on a cooperative thread,
      # which the strict pool below would turn into the whole suite stalling
      # behind it. Idempotent, so the tests' own call is then a no-op.
      - name: Generate test fixtures
        run: bash Tests/LumeEngineCoreTests/Fixtures/generate-fixtures.sh TestStreams/generated

      - name: Run tests
        # One cooperative thread for all of Swift concurrency. Code that blocks
        # a cooperative thread — a blocking Channel.receive, a semaphore or
        # condition wait, a thread join reached from an actor or an async test —
        # then hangs or stalls the run here, instead of only starving the pool
        # on a loaded machine (PLAN.md D1; see DedicatedThread and ChannelDrain).
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: swift test

  # Offline documentation check: relative links and in-repo anchors in every
  # tracked Markdown file resolve, and CLAUDE.md is still the AGENTS.md
  # symlink. No network, no dependencies beyond the runner's python3.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links and anchors
        run: python3 .github/scripts/check-docs.py

  # Cross-compile the library products for the shipping platforms. `swift test` above
  # only proves macOS: platform-conditional code (VideoToolbox paths, PiP, audio session)
  # can break iOS/tvOS without a macOS build noticing. Compile-only — no simulator run —
  # so this costs one FFmpeg slice per platform and nothing else.
  #
  # visionOS is absent because this matrix entry has never been verified: the xrOS
  # SDK ships with Xcode (the release job's preflight checks for it), but building
  # to a visionOS *destination* additionally needs Xcode's visionOS platform
  # component, which was not installed on the machine this was written on. Add the
  # entry once someone can confirm a hosted runner builds
  # `-destination 'generic/platform=visionOS'`; until then verify visionOS locally
  # when touching platform-conditional code.
  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            slice: ios-arm64
            destination: generic/platform=iOS
          - platform: tvOS
            slice: tvos-arm64
            destination: generic/platform=tvOS
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/output
          key: ffmpeg-${{ hashFiles('build/versions.json', 'build/scripts/**', 'build/patches/**') }}-${{ matrix.slice }}

      - name: Download FFmpeg and dav1d sources
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: build/scripts/fetch-sources.sh

      - name: Install build tooling
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install meson ninja

      - name: Build FFmpeg (${{ matrix.slice }})
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: build/scripts/build-ffmpeg.sh ${{ matrix.slice }}

      - name: Package xcframework
        run: build/scripts/make-xcframework.sh

      - name: Build LumeEngine for ${{ matrix.platform }}
        run: |
          set -euo pipefail   # without this, piping to tail would swallow build failures
          xcodebuild build \
            -scheme LumeEngine \
            -destination '${{ matrix.destination }}' \
            | tail -20

  # Full 10-slice xcframework build, attached to releases (PLAN.md §5).
  release-binaries:
    name: Release xcframework
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    # The repository's default workflow token is read-only, so the upload below
    # needs this explicitly — otherwise the whole 10-slice build finishes and
    # then fails at the last step.
    permissions:
      contents: write
    steps:
      # A published artifact is never rebuilt. Package.swift pins its SHA-256,
      # and a rebuild is not bit-identical, so replacing the zip would break
      # every consumer resolving that release. This is what makes the release
      # drill safe: tag, let this job attach the artifact, point Package.swift
      # at it, then move the tag onto that commit — the re-pushed tag runs
      # this job again, and it must leave the published zip alone.
      - name: Check for an already published artifact
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx 'FFmpeg.xcframework.zip'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME already has FFmpeg.xcframework.zip — not rebuilding it"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.published.outputs.exists != 'true'
      # Fail in seconds rather than after a 40-minute build. build-ffmpeg.sh
      # resolves each slice's SDK through `xcrun --sdk`, so an SDK absent from the
      # runner image can only yield an incomplete xcframework — better to say so
      # up front than to publish a release with slices silently missing.
      - name: Verify platform SDKs
        if: steps.published.outputs.exists != 'true'
        run: |
          missing=""
          for sdk in macosx iphoneos iphonesimulator appletvos appletvsimulator xros xrsimulator; do
            xcrun --sdk "$sdk" --show-sdk-path >/dev/null 2>&1 || missing="$missing $sdk"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing SDKs on this runner:$missing — cannot build a complete xcframework"
            exit 1
          fi
          echo "all 7 platform SDKs present"
      - name: Download FFmpeg and dav1d sources
        if: steps.published.outputs.exists != 'true'
        run: build/scripts/fetch-sources.sh
      - name: Install build tooling
        if: steps.published.outputs.exists != 'true'
        # nasm: dav1d's and FFmpeg's x86_64 assembly; meson + ninja: dav1d.
        run: brew install nasm meson ninja
      - name: Build all slices
        if: steps.published.outputs.exists != 'true'
        run: |
          for p in macos-arm64 macos-x86_64 ios-arm64 ios-sim-arm64 ios-sim-x86_64 tvos-arm64 tvos-sim-arm64 tvos-sim-x86_64 xros-arm64 xros-sim-arm64; do
            build/scripts/build-ffmpeg.sh "$p"
          done
      - name: Package and checksum
        if: steps.published.outputs.exists != 'true'
        run: |
          build/scripts/make-xcframework.sh
          ditto -c -k --keepParent BinaryDependencies/FFmpeg.xcframework FFmpeg.xcframework.zip
          swift package compute-checksum FFmpeg.xcframework.zip > FFmpeg.xcframework.zip.checksum
      - name: Attach to release
        if: steps.published.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FFmpeg.xcframework.zip
            FFmpeg.xcframework.zip.checksum
